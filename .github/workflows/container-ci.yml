# Container quality gate — lint the shell scripts the image boots from, run the
# wedge-watchdog unit tests, and prove the built image can still boot them.
#
# These scripts had NO gate at all before this workflow. entrypoint.sh already
# carried inline `# shellcheck disable=` directives, which read as evidence that
# something was linting it — nothing was. The directives were decorative, and a
# syntax error or an unquoted expansion in the boot path would only ever have
# surfaced as a container that dies at startup on the deployment host.
#
# Four checks:
#   shellcheck -x --shell=sh -> 0 findings across the four scripts
#   sh watchdog_test.sh      -> the fixture tests for the wedge predicate
#   the `image` job          -> the runtime stage builds, and the files the
#                               entrypoint sources at boot are actually IN it
#   the `e2e` job            -> the watchdog's supervision LOOP, driven against a
#                               real JVM that really deadlocks
name: Container CI

on:
  push:
    branches:
      - main
      # v2 is the long-lived V2 integration branch — V2 work lands there, never
      # directly on main. Without this entry the container scripts would stay
      # ungated on the branch they are actually developed on.
      - v2
    paths:
      - "entrypoint.sh"
      - "watchdog.sh"
      - "watchdog_test.sh"
      - "testdata/watchdog/**"
      - "Dockerfile"
      - ".github/workflows/container-ci.yml"
  pull_request:
    paths:
      - "entrypoint.sh"
      - "watchdog.sh"
      - "watchdog_test.sh"
      - "testdata/watchdog/**"
      - "Dockerfile"
      - ".github/workflows/container-ci.yml"

# Only one run per ref at a time: a newer push cancels the older in-progress run.
concurrency:
  group: container-ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the checks only need to read the repository.
permissions:
  contents: read

jobs:
  shell:
    name: Shell lint and tests
    runs-on: ubuntu-latest
    # Job-level ceiling so a hung run cannot burn the 6-hour default — the same
    # reason backend-ci.yml carries one. This job is seconds of work, and the
    # Test step below can HANG rather than fail (see its comment), which is
    # precisely the shape that needs a ceiling. 5 minutes is a wide margin.
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pinned by VERSION, and run from the same container image the local gate
      # uses, so CI and local run the SAME linter.
      #
      # `apt-get install shellcheck` was not a pin: it installs whatever the
      # runner image happens to carry (0.9.0 on ubuntu-24.04) while the
      # documented local command uses koalaman/shellcheck:stable (0.11.0) — two
      # linters roughly two years apart, either of which could report findings
      # the other does not. `stable` is not a pin either; it moves. Both sibling
      # workflows pin their tools (golangci-lint v2.12.2, Node 26, Bun 1.3.11)
      # for exactly this reason. Bump this as its own commit, with any fixes the
      # new version demands.
      #
      # --shell=sh because all four scripts are POSIX sh (the image's /bin/sh),
      # not bash — without it shellcheck would accept bashisms the container
      # cannot run. The e2e runner is linted with the same settings even though it
      # runs on the HOST: it drives the container, and a bashism there is just as
      # broken on a machine whose /bin/sh is dash.
      #
      # -x plus the `# shellcheck source=watchdog.sh` directive at entrypoint.sh's
      # source line are what let the linter FOLLOW that source: the directive maps
      # the in-image path (/app/watchdog.sh) to the file's location in the
      # repository, and -x is what makes shellcheck act on it. Measured on this
      # tree with both 0.9.0 and 0.11.0, dropping -x while passing every file
      # as an input still exits 0 — so -x is not what keeps this command green. What
      # it buys is that `shellcheck entrypoint.sh` ALONE also works: without -x
      # that single-file invocation reports SC1091 and exits 1, which is what
      # anyone linting one file by hand would hit.
      - name: Lint
        run: |
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt \
            koalaman/shellcheck:v0.11.0 \
            -x --shell=sh entrypoint.sh watchdog.sh watchdog_test.sh \
            testdata/watchdog/e2e/run.sh

      # Runs under plain `sh`, exactly as it does locally and in the image. The
      # suite sources watchdog.sh, which is contractually side-effect free — if
      # a top-level statement is ever added to that file this step hangs rather
      # than failing, which is itself the signal.
      - name: Test
        run: sh watchdog_test.sh

  # ── Does the image still BOOT? ──────────────────────────────────────────────
  # This job exists because of a bug this very branch shipped. Commit a96b1a1
  # added `. /app/watchdog.sh` to entrypoint.sh; the matching `COPY watchdog.sh`
  # only arrived two commits later in d358b94. In between, `docker build`
  # succeeded and the container died instantly at startup — no API, no SPA, no
  # engine. Dockerfile was already in this workflow's path filter, but nothing
  # here consumed it, so the gate was blind to a hard boot failure.
  #
  # WHAT THIS BUILDS: the REAL runtime stage of the REAL Dockerfile, verbatim.
  # The four toolchain stages (Go, Bun, Gradle, KCEF) are replaced by an empty
  # stub context with `--build-context`, so they are never built — but every
  # instruction of the runtime stage, including each COPY, runs exactly as it
  # does in production. That is what makes the missing-COPY bug reproducible
  # here. Both the stub layout and the list of stages to override are DERIVED
  # from the Dockerfile's own `COPY --from=` lines, so a new stage or a moved
  # artifact path is picked up automatically rather than silently un-stubbed.
  #
  # WHAT IT DOES NOT CATCH, stated plainly:
  #   * anything inside the four stubbed stages — the Go build, the Nuxt build,
  #     the engine-host Gradle build and the KCEF Chromium bundle are NOT
  #     exercised. The first two are covered by backend-ci / frontend-ci; the
  #     last two are proven only by a real image build.
  #   * the stubs are empty DIRECTORIES, so nothing that depends on the CONTENT
  #     of a copied artifact is covered. No runtime-stage instruction reads that
  #     content today; one that did would fail here and need a real fixture.
  #   * it does not RUN entrypoint.sh — that starts Xvfb, dbus and a JVM. It
  #     re-runs only the top-level `. <path>` lines, so a fault LATER in the
  #     entrypoint (a missing binary at the final exec, a bad gosu call) is out
  #     of scope.
  # It DOES catch: a file the entrypoint sources at boot that the Dockerfile
  # never copies, a syntax error in either script severe enough to abort the
  # sourcing shell, and a runtime stage that no longer builds at all.
  image:
    name: Image boot
    runs-on: ubuntu-latest
    # Measured at ~1m40s cold locally; the runner additionally pulls the JRE base
    # image. 15 leaves a wide margin without approaching the 6-hour default.
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # One empty directory per `COPY --from=` source path. Directories are
      # enough: BuildKit copies a directory where the real stage produced a file
      # just as happily, and nothing in the runtime stage reads the content.
      # Kept outside the repository so it never enters the build context itself.
      - name: Stub the toolchain stages
        run: |
          stub="$RUNNER_TEMP/dockerstub"
          rm -rf "$stub"
          grep -E "^COPY[[:space:]]+--from=" Dockerfile | awk '{print $3}' | while read -r src; do
            mkdir -p "$stub/${src#/}"
          done
          find "$stub" -type d

      # `--build-context <stage>=<dir>` overrides a named build stage with a
      # local directory, so `COPY --from=builder …` reads from the stub and the
      # builder stage is never built. The stage names come from the Dockerfile
      # rather than a hardcoded list.
      - name: Build the runtime stage
        run: |
          stub="$RUNNER_TEMP/dockerstub"
          set --
          for stage in $(grep -E "^COPY[[:space:]]+--from=" Dockerfile \
              | sed -E "s/^COPY[[:space:]]+--from=([^[:space:]]+).*/\1/" | sort -u); do
            set -- "$@" --build-context "$stage=$stub"
          done
          echo "overriding stages: $*"
          docker buildx build "$@" --load -t tsundoku-container-ci:boot .

      # The assertion reads /app/entrypoint.sh OUT OF THE BUILT IMAGE and re-runs
      # the same top-level `. <path>` lines the container executes at boot, so a
      # file the Dockerfile forgot to copy fails here exactly as it does in
      # production ("cannot open /app/watchdog.sh: No such file"). Grepping the
      # line out of the image rather than hardcoding the path is what keeps this
      # honest if the entrypoint ever sources something else.
      - name: Boot check
        run: |
          docker run --rm --entrypoint /bin/sh tsundoku-container-ci:boot -ec '
            sources=$(grep "^\. /" /app/entrypoint.sh)
            [ -n "$sources" ] || { echo "no top-level source line found in /app/entrypoint.sh"; exit 1; }
            echo "re-running the entrypoint boot sources: $sources"
            eval "$sources"
            command -v supervise_engine_health > /dev/null \
              || { echo "watchdog functions are undefined after sourcing"; exit 1; }
            echo "boot check: entrypoint sources resolve and the watchdog is defined"
          '

  # ── Does the watchdog actually DECIDE correctly? ────────────────────────────
  # The `shell` job covers the predicate against checked-in thread dumps. It
  # cannot cover supervise_engine_health — the loop that decides whether to kill
  # the production source engine, and the only part of this feature whose
  # mistakes are destructive. Both high-severity defects fixed on this branch
  # (a majority "6 of 8 blocked" rule that killed a healthy engine, and a
  # thread-name anchor a process-global JDK counter could shift) were found by
  # driving that loop against a live JVM. Neither was visible to the fixture
  # suite, because a fixture is a transcript of a decision already made.
  #
  # testdata/watchdog/e2e/run.sh boots the REAL entrypoint.sh and watchdog.sh in
  # a container around a JVM that really deadlocks, and asserts what the watchdog
  # DID: it restarts a wedged engine (under both accepted pool-thread naming
  # shapes) and leaves a merely saturated one alone while its long call finishes.
  #
  # WHEN THIS RUNS, and why that choice: on every push and pull request that
  # touches the container scripts — the same path filter as the rest of this
  # workflow, at the top of the file. It is NOT nightly and NOT manual-only. It
  # costs a few minutes, but these files change rarely, so the path filter
  # already keeps that cost near zero on a normal day; and a nightly run would
  # report a regression hours after the commit that caused it, on a component
  # whose failure mode is "the engine is silently never recovered". Paying the
  # minutes on the commits that can actually break it is the cheaper trade.
  #
  # WHAT IT DOES NOT COVER, stated plainly:
  #   * the real engine-host. The JVM under test is testdata/watchdog/e2e/
  #     FakeEngine.java, which mirrors RpcServer's pool shape and /health but
  #     runs no extensions, no KCEF and no Chromium. A wedge that only the real
  #     extension stack can produce is out of scope.
  #   * the image itself. This builds its own minimal container (Xvfb, dbus, the
  #     Go server and the Gradle launcher are all stood in for), so it proves
  #     nothing about the product image — that is the `image` job's business.
  #   * the shipped TIMING. Probe interval, thresholds and cooldowns are
  #     compressed so a case finishes in seconds. The predicate, the verdicts and
  #     the kill path are the shipped ones.
  e2e:
    name: Watchdog e2e
    runs-on: ubuntu-latest
    # Measured at ~1m30s locally with a warm image cache; a runner additionally
    # pulls the JDK base image and builds every layer cold. 20 is a wide margin
    # and still far short of the 6-hour default.
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The runner builds its own image and cleans up its containers on exit.
      # WATCHDOG_E2E_BREAK is deliberately NOT set here: it re-injects the two
      # defects to prove the assertions can fail, which is a local verification
      # step, not a gate.
      - name: Wedge and saturation e2e
        run: sh testdata/watchdog/e2e/run.sh
