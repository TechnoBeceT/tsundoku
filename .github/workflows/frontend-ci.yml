# Frontend quality gate — lint, type-check, unit tests, API-type drift, and the
# Storybook build. Runs on every push to main and every pull request that touches
# the frontend, so a type-check regression (like the ~78-error debt this workflow
# was added to prevent recurring) can never land silently again.
#
# Mirrors the local gate documented in frontend/package.json + the repo
# architecture notes:
#   bun run lint            -> ESLint (0 problems)
#   bun run typecheck       -> nuxt typecheck / vue-tsc (0 errors)  <-- the re-armed gate
#   bun run test            -> Vitest unit suite
#   bun run check:api-drift -> regenerates the TS client from openapi.yaml and
#                              fails if it diverges from the committed types
#   bun run build-storybook -> proves every *.stories.ts still compiles
name: Frontend CI

on:
  push:
    branches:
      - main
      # v2 is the long-lived V2 integration branch — V2 work lands there, never
      # directly on main. Without this entry the whole V2 line (which is mostly
      # frontend) would be completely ungated, re-opening the exact hole this
      # workflow was added to close.
      - v2
    paths:
      - "frontend/**"
      - "backend/internal/api/openapi.yaml"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/internal/api/openapi.yaml"
      - ".github/workflows/frontend-ci.yml"

# Only one run per ref at a time: a newer push cancels the older in-progress run.
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the checks only need to read the repository.
permissions:
  contents: read

# Every bun command runs from the frontend package.
defaults:
  run:
    working-directory: frontend

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      # check:api-drift reads ../backend/internal/api/openapi.yaml, so we need the
      # whole repo, not just the frontend directory.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node is pinned because the unit suite RUNS ON NODE, not on Bun:
      # `bun run test` invokes node_modules/.bin/vitest, whose shebang is
      # `#!/usr/bin/env node`, and vitest forks its test pool as Node processes.
      # The Node MAJOR therefore decides whether the tests pass.
      #
      # Node 22+ defines its own experimental `localStorage`/`sessionStorage`
      # globals, which shadow the happy-dom ones the 'nuxt' vitest environment
      # installs — that shadowing failed 10 specs locally while CI stayed green.
      # The fix is `execArgv: ['--no-experimental-webstorage']` in
      # frontend/vitest.config.ts, and it is a NO-OP on Node < 22. So an
      # unpinned runner silently disagrees with local in whichever direction it
      # drifts: an older runner would hide a real failure, a newer one would
      # invent one. Pinning the major makes CI and local agree by construction.
      #
      # No cache: input — dependencies are installed by Bun below, and there is
      # no npm lockfile for setup-node to key a cache on.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      # Pinned for the same reason as Node above: `latest` lets the runner's
      # toolchain move without a commit, so CI and local silently disagree and
      # the gate reports on a stack nobody is developing against. This is the
      # version the project is developed on — bump it as its own commit.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      # --frozen-lockfile fails if bun.lock is out of date, so CI installs exactly
      # what is committed (postinstall runs `nuxt prepare` to generate .nuxt types
      # that vue-tsc needs).
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: API-type drift
        run: bun run check:api-drift

      - name: Build Storybook
        run: bun run build-storybook
