# golangci-lint v2 configuration for the Tsundoku backend.
# Fleet standard: gofmt + vet + security + duplication + complexity.
# See ENGINEERING.md §7 for the rationale.
#
# Note: in golangci-lint v2, formatters are declared under `formatters:`,
# linter settings under `linters.settings:`, and exclusions under
# `linters.exclusions:` — the v1 top-level `linters-settings:` and
# `issues.exclude-rules:` keys are silently ignored by v2, which is exactly
# how the thresholds below stopped being enforced. `config verify` is the
# gate that catches that regression; CI runs it.

version: "2"

formatters:
  enable:
    - gofmt

linters:
  default: none
  enable:
    # Static analysis (includes go vet passes)
    - govet
    # Security scanning
    - gosec
    # Duplication detection
    - dupl
    # Cyclomatic complexity
    - cyclop
    # Cognitive complexity
    - gocognit
    # Error return checking
    - errcheck
    # Unused code
    - unused
    # Simplification and correctness suggestions
    - gocritic

  settings:
    cyclop:
      # Maximum cyclomatic complexity per function.
      max-complexity: 10
    gocognit:
      # Minimum cognitive complexity score to flag.
      min-complexity: 15
    dupl:
      # Minimum token count to report as duplication.
      threshold: 100

  exclusions:
    # Ent's generated output is not ours to lint; the hand-written
    # `internal/ent/schema/` package is. Every generated file carries the
    # "Code generated by ent, DO NOT EDIT." header and no schema file does,
    # so `generated: lax` — the v2 default, pinned explicitly — draws exactly
    # that line.
    #
    # This carries over the v1 `issues.exclude-rules` entry
    # `path: internal/ent/(?!schema)`, which was dead twice over: it sat under
    # a key v2 ignores, AND its negative lookahead is not expressible in Go's
    # RE2 engine, so it could never have compiled even under the right key.
    # v2 rejects the obvious `path` + `path-except` rewrite ("should not be set
    # at the same time") and enumerating the ~30 generated subpackages by name
    # would drift every time an entity is added — so the header-based mechanism
    # is the faithful rendering of the original intent.
    generated: lax

issues:
  # Surface all issues without capping per-linter or per-symbol.
  max-issues-per-linter: 0
  max-same-issues: 0
